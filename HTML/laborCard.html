
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Labour Card</title>

<style>
@page {
    size: A5 portrait;
    margin: 8mm;
}

body {
    margin: 0;
    font-family: Calibri, Arial, sans-serif;
    background: #fff;
}

table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
}

td, th {
    border: 1px solid #000;
    font-size: 10.5pt;
    padding: 2px;
    height: 22px;
    vertical-align: middle;
}

.center { text-align: center; }
.left { text-align: left; }
.bold { font-weight: bold; }

.small { font-size: 9pt; }
.tall { height: 28px; }
.signature { height: 45px; }

</style>
</head>

<body>

<table>

<!-- TITLE -->
<tr>
    <td colspan="18" class="center bold tall">LABOUR CARD</td>
</tr>

<!-- NAME / PROFESSION -->
<tr>
    <td colspan="3" class="bold">Name:</td>
    <td colspan="6"></td>
    <td colspan="3" class="bold">Profession:</td>
    <td colspan="6"></td>
</tr>

<!-- MONTH / YEAR -->
<tr>
    <td colspan="3" class="bold">Month:</td>
    <td colspan="6"></td>
    <td colspan="3" class="bold">Year:</td>
    <td colspan="6"></td>
</tr>

<!-- RATES -->
<tr>
    <td colspan="3" class="bold">Per Month</td>
    <td colspan="3"></td>
    <td colspan="3" class="bold">Per Day</td>
    <td colspan="3"></td>
    <td colspan="3" class="bold">Per Hour</td>
    <td colspan="3"></td>
</tr>

<!-- DATE HEADER 1–16 -->
<tr>
    <td colspan="2" class="bold center">DATE</td>
    <td class="center">1</td><td class="center">2</td><td class="center">3</td>
    <td class="center">4</td><td class="center">5</td><td class="center">6</td>
    <td class="center">7</td><td class="center">8</td><td class="center">9</td>
    <td class="center">10</td><td class="center">11</td><td class="center">12</td>
    <td class="center">13</td><td class="center">14</td><td class="center">15</td>
    <td class="center">16</td>
</tr>

<!-- ATTENDANCE -->
<tr>
    <td colspan="2" class="bold">Attendance</td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td></td>
</tr>

<!-- OVERTIME -->
<tr>
    <td colspan="2" class="bold">Over Time</td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td></td>
</tr>


<!-- DATE HEADER 17–31 -->
<tr>
    <td colspan="2" class="bold center">DATE</td>
    <td class="center">17</td><td class="center">18</td><td class="center">19</td>
    <td class="center">20</td><td class="center">21</td><td class="center">22</td>
    <td class="center">23</td><td class="center">24</td><td class="center">25</td>
    <td class="center">26</td><td class="center">27</td><td class="center">28</td>
    <td class="center">29</td><td class="center">30</td><td class="center">31</td>
    <td></td>
</tr>

<!-- ATTENDANCE -->
<tr>
    <td colspan="2" class="bold">Attendance</td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td></td>
</tr>

<!-- OVERTIME -->
<tr>
    <td colspan="2" class="bold">Over Time</td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td></td>
</tr>

<!-- SALARY SECTION -->
<tr>
    <td colspan="4" rowspan="6" class="bold center">Accountant</td>
    <td colspan="8" class="bold">Details</td>
    <td colspan="6" class="bold center">Amount</td>
</tr>

<tr>
    <td colspan="8">Basic Salary</td>
    <td colspan="6"></td>
</tr>

<tr>
    <td colspan="8">Add Overtime</td>
    <td colspan="6"></td>
</tr>

<tr>
    <td colspan="8" class="bold">Total</td>
    <td colspan="6"></td>
</tr>

<tr>
    <td colspan="8">Less Advance</td>
    <td colspan="6"></td>
</tr>

<tr>
    <td colspan="8">Fines</td>
    <td colspan="6"></td>
</tr>

<tr>
    <td colspan="12" class="bold">Balance</td>
    <td colspan="6"></td>
</tr>

<!-- SIGNATURE -->
<tr>
    <td colspan="18" class="signature bold">
        Receiver’s Signature
    </td>
</tr>

</table>

</body>
</html>
